name: Build SwarmCoder

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Tests that need Docker's worker image, a browser, a live model or a paid cloud model
    # skip themselves here and say so (docs/TESTING.md).
    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: surefire-reports
        path: '**/target/surefire-reports/*.txt'
        retention-days: 7
